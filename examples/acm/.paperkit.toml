# paperkit configuration for the ACM example: a paper and its supplementary
# material built from one source tree, under the acm profile.
#
# Every key is optional. This file writes out the ones a real paper reaches
# for, with the reason next to each; the full list, with every default, is
# docs/configuration.md. Paths are relative to this directory.

[project]
# The main files, without .tex. Two targets here: the paper and its
# supplementary material. Both build in parallel, each into out/<main>/, and
# `paperkit build paper` builds just one and prints its full report.
mains = ["paper", "supplementary"]
# Where the other .tex sources are. The source checks (non-ASCII, trailing
# whitespace, final newline) read these, and a change in them makes the
# bibliography check rerun.
content_dirs = ["content", "header", "figures/tex"]
# The bibliography both targets share. Unused entries are judged against the
# citations of every target that uses this file.
bib = "content/references.bib"

[build]
engine = "pdflatex"       # or lualatex, xelatex; "typst" is a different world, see examples/typst
# Four passes instead of three: acmart's pbalance balances the columns of
# the last page on the fourth pass. The acm profile sets this; it is written
# out so the file shows what the build does.
passes = 4
# -shell-escape lets minted and svg call external programs. Nothing here
# needs it, and a build that does not need it should not grant it.
shell_escape = false
bibtex = true             # run BibTeX after the first pass
biber = false             # for biblatex projects, instead of bibtex
output_dir = "out"        # out/paper/, out/supplementary/
# Every tool builds with this timestamp, so two builds of one commit give
# byte-identical PDFs. "git" takes the committer date of HEAD; an ISO date or
# an epoch pins it by hand. Outside a git repository "git" falls back to the
# current time and the report says the build is not reproducible.
source_date_epoch = "git"

[docker]
# The image is cached under this tag; give each paper its own so that two
# papers with different packages do not rebuild each other's image.
image_name = "paperkit-example-acm"
base_image = "ubuntu:26.04"
# APT packages this paper needs beyond the engines and the check tools, for
# instance a font package or inkscape for svg. acmart needs nothing.
extra_packages = []

[texlive]
# TeX Live from a dated upstream snapshot rather than the base image's
# packages: the same package set on every rebuild, on every machine, and a
# current acmart. The checksum is of the repository's package database; a
# repository that changed under you fails the image build instead of
# producing a different TeX Live. `paperkit texlive-update` moves both
# values to the newest snapshot; `paperkit init` writes the one verified for
# the installed paperkit.
source = "upstream"
snapshot = "2026-10-25"
tlpdb_sha512 = "da7154dcba9e415aacd31e2cd6f4a75764b8c788a5c0a125109429f1ed556a3fcb8546216e1bab316594cc85f1618b0af70a7ab86d1fab2af7a5e0e211eb9f39"
# scheme-small plus the collections a paper needs. acmart is in publishers,
# its fonts in fontsextra, booktabs in latexextra, TikZ in pictures.
scheme = "small"
collections = [
    "latexextra",
    "fontsrecommended",
    "fontsextra",
    "publishers",
    "mathscience",
    "pictures",
    "bibtexextra",
]

[checks]
# All on. Narrow a check rather than switch it off: the file and line in
# the report are usually a two-minute fix. docs/checks.md says what each
# one catches and when it is skipped rather than run.
non_ascii = true          # accents and dashes as LaTeX, so every editor shows the same file
trailing_whitespace = true
final_newline = true
font_embedding = true     # TAPS and PDF eXpress reject a PDF with a font that is not embedded
no_type3 = true           # and bitmap (Type 3) fonts, usually brought in by a plot
overfull_boxes = true     # text in the margin
# Entries nothing cites, across both targets. An entry staged for a later
# version can be excused by key instead of deleted:
# unused_bib = { ignore = ["kept_for_the_journal_version"] }
unused_bib = true
# The bibliography is held to one formatting, so a diff of it shows a change
# of content. `paperkit bibtidy` rewrites it that way; the check only reports.
bibtex_tidy = { enabled = true, version = "1.14.0", sort = true }

[page_limits]
# ACM calls state the limit as "N pages, not including references", so the
# acknowledgments are inside the budget and only the references are outside.
# The acm profile sets ack_counts_as_content; the number is the call's.
before_refs = 12
ack_counts_as_content = true
# total = 14              # a cap on the whole PDF, references included
# before_ack = 12         # a budget that ends at the acknowledgments instead

[zip]
# `paperkit zip` writes paper-sources.zip from these patterns, relative to
# this directory; {main} stands for each target in turn, and a pattern that
# matches nothing is skipped. The compiled .bbl travels next to each main
# (include_bbl), because TAPS compiles the sources without running BibTeX.
# The acm profile also lists acmart.cls and ACM-Reference-Format.bst, for a
# project that carries its own copies.
name = "paper"
include = [
    "{main}.tex",
    "header/*.tex",
    "content/**/*.tex",
    "content/references.bib",
    "figures/tex/*.tex",
    "acmart.cls",
    "ACM-Reference-Format.bst",
]
exclude = ["*.aux", "*.log", "*.out", "*.blg", "*.bbl"]
include_bbl = true

[profile]
# The venue's defaults, laid under this file: the class files and the .bbl in
# the archive, four passes, the acknowledgments counted. A key written here
# wins over the profile's.
name = "acm"
