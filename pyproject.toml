[project]
name = "paperkit"
version = "0.1.0"
description = "Reproducible builds and pre-submission checks for research papers"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Antonio Paolillo", email = "antonio.paolillo@vub.be" },
]
requires-python = ">=3.13"
keywords = ["latex", "paper", "camera-ready", "reproducible-builds", "docker", "texlive"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup :: LaTeX",
]
dependencies = [
    "click>=8",
    "pythainer>=0.0.7",
]

[project.urls]
Homepage = "https://github.com/apaolillo/paperkit"
Issues = "https://github.com/apaolillo/paperkit/issues"

[project.scripts]
paperkit = "paperkit.cli:main"

# Development tools, installed by `uv sync` (not part of the published metadata).
[dependency-groups]
dev = [
    "black>=25",
    "isort>=6",
    "ruff<=0.13.0",
    "mypy<=1.18.1",
    "types-click<=7.1.8",
    "pytest>=8",
]

[build-system]
# 1.27 supports the SPDX `license` expression and `license-files`.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/ROADMAP.md", "/LICENSE", "/pyproject.toml"]

[tool.hatch.build]
exclude = [
    "/.venv*",
    "/venv*",
    "/__pycache__",
    "*.pyc",
    "/.git",
]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "RET", "A", "TID", "ERA", "S"]
ignore = [
    "S603",   # subprocess calls: a build tool, all inputs are trusted
    "S607",   # partial executable paths: pdflatex/bibtex/pdffonts are expected on PATH
    "ERA001", # false positives on section comments like "# [project]"
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.13"
packages = ["paperkit"]
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
strict_equality = true
pretty = true

[[tool.mypy.overrides]]
module = "pythainer.*"
ignore_missing_imports = true
